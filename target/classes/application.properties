# ---------- Server ----------
server.port=8080

# ---------- MySQL Database ----------
# Create the database first:  CREATE DATABASE fake_medicine_db;
spring.datasource.url=jdbc:mysql://localhost:3306/fake_medicine_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Blessy21!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update will auto-create/update the `medicines` table from the entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- App secret used to sign the tamper-proof integrity hash ----------
# IMPORTANT: change this to a long random string in production, and load it
# from an environment variable instead of committing it to source control.
app.integrity.secret=ChangeThisSecretKeyInProduction123!

# ---------- JWT (login tokens) ----------
# IMPORTANT: change this too, and load both secrets from env vars in production.
app.jwt.secret=MySuperSecretKeyForFakeMedicineDetectorApp_ChangeMe_2026!!
# Token lifetime in milliseconds (86400000 = 24 hours)
app.jwt.expiration-ms=86400000
